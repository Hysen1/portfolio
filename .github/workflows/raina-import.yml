name: Import approved Raina static publication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/raina-import.yml]

permissions:
  contents: write

concurrency:
  group: raina-static-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'Hysen1/portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINAL_ZIP_SHA256: c3c1864d091e8ea3de6cf690133f75469baf23b8ec8fa4473419a1b94afd508a
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Download the approved archive
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FINAL_ZIP_SHA256" =~ ^[a-f0-9]{64}$ ]]
          curl --fail --show-error --silent --location --max-redirs 0 \
            --proto '=https' --tlsv1.2 --connect-timeout 30 --max-time 300 \
            --max-filesize 1073741824 \
            --output "$RUNNER_TEMP/raina-final-publication.zip" \
            'https://ubiquitous-journey-r9g76v6ww7ph547x-8081.app.github.dev/raina-final-publication.zip'
          printf '%s  %s\n' "$FINAL_ZIP_SHA256" "$RUNNER_TEMP/raina-final-publication.zip" | sha256sum --check --strict

      - name: Validate and copy only the approved static files
        shell: python
        run: |
          import os, re, stat, zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          archive = Path(os.environ['RUNNER_TEMP']) / 'raina-final-publication.zip'
          prefix = 'projects/beauty-studio-by-raina/'
          special = {'index.html', '.nojekyll', prefix + 'README.md', prefix + '.nojekyll'}
          required = {'index.html', '.nojekyll', prefix + 'README.md', prefix + 'index.html'}
          extensions = {'.html', '.css', '.js', '.svg', '.woff', '.woff2', '.ttf', '.eot', '.otf',
                        '.jpg', '.jpeg', '.png', '.gif', '.webp', '.avif', '.ico', '.mp4', '.webm'}
          forbidden = re.compile(r'(?:config|secret|backup|\.env|\.(?:php\d*|phtml|phar|sql|bak|zip|tar|gz|pem|key)(?:\.|$))', re.I)
          sensitive = re.compile(rb'<\?php|DB_PASSWORD|MYSQL_ROOT_PASSWORD|-----BEGIN (?:[A-Z ]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}')
          text_extensions = {'.html', '.css', '.js', '.svg', '.md'}
          seen, files, total = set(), [], 0

          with zipfile.ZipFile(archive) as package:
              for entry in package.infolist():
                  name = entry.orig_filename
                  path = PurePosixPath(name)
                  parts = name.rstrip('/').split('/')
                  assert name == entry.filename and name, 'Invalid ZIP filename'
                  assert not path.is_absolute() and '\\' not in name and ':' not in name, 'Absolute or non-POSIX ZIP path'
                  assert all(p not in ('', '.', '..') for p in parts), 'ZIP traversal or empty path component'
                  assert all(ord(c) >= 32 and ord(c) != 127 for c in name), 'Control character in ZIP path'
                  key = name.rstrip('/').casefold()
                  assert key not in seen, 'Duplicate ZIP path'
                  seen.add(key)
                  assert not entry.flag_bits & 1, 'Encrypted ZIP entry'
                  kind = stat.S_IFMT(entry.external_attr >> 16)
                  assert kind in (0, stat.S_IFDIR if entry.is_dir() else stat.S_IFREG), 'Symlink or special ZIP entry'
                  if entry.is_dir():
                      assert name in ('projects/', prefix) or name.startswith(prefix), 'Unexpected ZIP directory'
                      assert not forbidden.search(name) and not any(p.startswith('.') for p in parts), 'Forbidden ZIP directory'
                      continue
                  assert name in special or (name.startswith(prefix) and path.suffix.lower() in extensions), 'Unapproved ZIP file'
                  assert not forbidden.search(name), 'Sensitive or executable ZIP filename'
                  assert not any(p.startswith('.') for p in parts) or name in special, 'Hidden ZIP file'
                  assert entry.file_size <= 95 * 1024 * 1024, 'File exceeds publication limit'
                  total += entry.file_size
                  assert total <= 1024 * 1024 * 1024, 'Archive exceeds expanded size limit'
                  destination = root.joinpath(*path.parts)
                  assert destination.resolve().is_relative_to(root), 'Destination outside checkout'
                  assert not any(p.is_symlink() for p in (destination, *destination.parents)), 'Existing destination symlink'
                  files.append((entry, destination))

              assert len(files) == 902, f'Expected 902 approved files; found {len(files)}'
              assert required <= {entry.filename for entry, _ in files}, 'Missing required publication file'
              # Read/CRC-check every file and inspect text before writing anything.
              for entry, _ in files:
                  content = package.read(entry)
                  if PurePosixPath(entry.filename).suffix.lower() in text_extensions:
                      assert not sensitive.search(content), 'Server-side code or secret marker in publication'
                  if PurePosixPath(entry.filename).name == '.nojekyll':
                      assert not content, '.nojekyll must be empty'
              for entry, destination in files:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(package.read(entry))
                  destination.chmod(0o644)
          print(f'Validated and copied {len(files)} static files ({total:,} bytes).')

      - name: Commit only the approved publication
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html .nojekyll projects/beauty-studio-by-raina/
          if git diff --cached --quiet; then
            echo 'The approved publication is already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish Beauty Studio by Raina static portfolio demo'
          git push origin HEAD:refs/heads/main
